name: Build Abbas AI Android APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']

permissions:
  contents: read

jobs:
  android-release:
    name: Build self-contained Abbas AI release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Java toolchain
        run: java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate bare React Native client
        run: npx tsc --noEmit

      - name: Build self-contained release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abbas-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
